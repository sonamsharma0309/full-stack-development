
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Counter and Timer</title>
</head>
<body>

    <h2>Click Counter</h2>

    <p>
        <span id="ContainerValue">0</span> times clicked
    </p>

    <button id="btn">Click Me</button>

    <hr>

    <h2>15 Minute Timer</h2>

    <h1 id="timer">15:00</h1>

    <button id="startBtn">Start Timer</button>
    <button id="snoozeBtn">Snooze 1 Minute</button>
    <button id="resetBtn">Reset Timer</button>

    <script src="EventListeners_Practise1.js"></script>

</body>
</html>
