
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Match</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #164e63, #155e75);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }

        .game {
            width: 430px;
            max-width: 100%;
            padding: 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #ffffff40;
            border-radius: 20px;
            box-shadow: 0 10px 30px #0004;
        }

        h1 {
            font-size: 27px;
        }

        .info {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            gap: 10px;
        }

        .info div {
            background: #0f2940;
            padding: 12px;
            border-radius: 10px;
            flex: 1;
            color: #67e8f9;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .card {
            height: 75px;
            border: none;
            border-radius: 12px;
            background: #0891b2;
            color: white;
            font-size: 30px;
            cursor: pointer;
            transition: 0.2s;
        }

        .card:hover {
            transform: scale(1.04);
            background: #06b6d4;
        }

        .card.open,
        .card.matched {
            background: #ecfeff;
            color: #164e63;
        }

        .card.matched {
            border: 2px solid #34d399;
        }

        #message {
            color: #a5f3fc;
            min-height: 24px;
            margin-top: 20px;
        }

        #restart {
            padding: 12px 25px;
            border: none;
            border-radius: 9px;
            background: #67e8f9;
            color: #164e63;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        @media (max-width: 380px) {
            .card {
                height: 60px;
                font-size: 25px;
            }

            .board {
                gap: 7px;
            }
        }
    </style>
</head>
<body>

    <div class="game">
        <h1>🧠 Memory Card Match</h1>
        <p>Find all 8 matching pairs!</p>

        <div class="info">
            <div>Score: <span id="score">0</span></div>
            <div>Moves: <span id="moves">0</span></div>
        </div>

        <div class="board" id="board"></div>

        <p id="message">Flip two cards to find a match!</p>

        <button id="restart">↻ Restart Game</button>
    </div>

    <script src="MemoryMatch.js"></script>
</body>
</html>
