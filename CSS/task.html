<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
            color: #302a25;
            font-family: "DM Sans", sans-serif;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            background-color: linear-gradient(violet, lightblue);

        }
    .slider{
        width: 50%;
        overflow: scroll;
        scrollbar-width: none;
        display: flex;

    }
    .item{
        min-width: 100%;
        height: 100vh;
        position: sticky;
        left: 0px;
        font-size: 100px;
        color: white;
        -webkit-text-stroke-width: 2px;
        -webkit-text-stroke-color: black;
        text-align: center;
    }
    
   
</style></style>
</head>
<body>
    <div class="slider">
        <div class="item" style="background-color: lightgray;""> hello </div>
        <div class="item" style="background-color: lightgreen;"> hello</div>
        <div class="item" style="background-color: lightpink;"> hello</div>
        <div class="item" style="background-color: lightblue;"> hello</div> 
        <div id="item" style="background-color: lightyellow;"> hello</div>

    </div>  
</body>
</html>
