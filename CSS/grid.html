<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    :root{
        --primary-color: #6f1e1e;
        --text-size: 30px;
    }
    .container{
        background-color:var(--primary-color);
        height:500px;
        width:500px;
        display :grid;
        outline:1px solid black;
        grid-template-columns:1fr 1fr 1fr;
        grid-template-rows:1fr 1fr 1fr;

    }
    .container>div{
        font-size:calc(var(--text-size)*2);
        outline:1px dashed black;
    }
    .parent{
        --primary-color:rgb(63, 63, 122);
        display:grid;
        background-color:rgb(121, 121, 181);
        grid-column:1/3;
        grid-row:1/3;
        grid-template-columns:subgrid;
        grid-template-rows:subgrid;
    }
    .child{
        --primary-color:rgb(21, 93, 76);
        background-color:var(--primary-color);
        color:white;
        grid-column:1/4;
        grid-row:2/2;
    }
   

</style>
<body>
    <div class ="container">
        <div class="parent"><div class="child"> 1 </div></div>

    </div>
</body>
</html>
