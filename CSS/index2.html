<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aesthetic Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Seaweed+Script&display=swap" rel="stylesheet">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{

    height:100vh;

    background:
    linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
    url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=80");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:'Poppins',sans-serif;
}

.container{

    width:420px;
    padding:35px;

    text-align:center;

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,.25);

    border-radius:25px;

    box-shadow:0 20px 40px rgba(0,0,0,.4);

}

h1{

    font-size:42px;
    background:linear-gradient(90deg,#ffffff,#ffb6c1);
    margin-bottom:20px;
}

img{

    width:250px;
    height:350px;

    object-fit:cover;

    border-radius:25px;

    border:4px solid white;

    box-shadow:0 15px 30px rgba(0,0,0,.4);

    transition:.4s;

}



p{

    margin-top:25px;

    color:white;

    font-size:28px;

    font-family:"Seaweed Script",cursive;

    line-height:1.5;

    letter-spacing:1px;

}



</style>

</head>

<body>

<div class="container">

<h1>Hello Guyzzz 👋</h1>

<img src="https://picsum.photos/500/700" alt="Nature">

<p>
Whereas disregard and contempt for human rights have resulted.
</p>


</div>

</body>
</html>
