<!DOCTYPE html>
<html>

<head>

    <title>Health Level</title>

    <style>

        body {
            background: linear-gradient(to right,black, rgb(98, 158, 174));
            
        }

        .box {
            width: 400px;
            background-color: white;
            padding: 30px;
            margin: 100px auto;
            border-radius: 15px;
        }

        h1 {
            color: green;
        }

        .bar {
            width: 100%;
            height: 25px;
            background-color: lightgray;
            border-radius: 20px;
        }

        .health {
            width: 75%;
            height: 25px;
            background: linear-gradient(to right, orange,orange,yellow, white);
            border-radius: 20px;
        }

        .score {
            color: green;
            font-size: 20px;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>Health Level</h1>

        <p>Your current health status</p>

        <div class="bar">
            <div class="health"></div>
        </div>

        <p class="score">Health Score: 75%</p>

    </div>

</body>

</html>
