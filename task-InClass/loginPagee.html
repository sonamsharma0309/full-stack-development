<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            font-family: Arial;
            background-color: #d6c0c0;
        }

        .login {
            width: 320px;
            background-color: white;
            padding: 25px;
            margin: 100px auto;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: rgb(65, 65, 174);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: rgb(45, 45, 140);
        }

        p {
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <h1 style="text-align: center;">Task-1:Login Page</h1>

    <div class="login">

       

        <h1>Login</h1>
        

        <label>Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Password</label>
        <input type="password" placeholder="Enter your password">

        <button>Login</button>

    </div>

</body>
</html>
