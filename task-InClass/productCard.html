<!DOCTYPE html>
<html>
<head>
    <title>Product Cards</title>

    <style>
        body {
            font-family: Arial;
            background-color: #eee;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background-color: white;
            width: 220px;
            padding: 15px;
            text-align: center;
            border: 1px solid #ccc;
        }

        .card img {
            width: 100%;
            height: 200px;
        }

        .card h2 {
            font-size: 20px;
        }

        .card p {
            color: gray;
        }

        .card h3 {
            color: black;
        }

        button {
            background-color: blue;
            color: white;
            border: none;
            padding: 10px 20px;
        }
    </style>
</head>

<body>

    <h1>Task 3 - Product Cards</h1>

    <div class="container">

        <div class="card">
            <img src="https://encrypted-tbn2.gstatic.com/shopping?q=tbn:ANd9GcQ2blvqatM967pStQTDl0vrez-gc8YA0vpy2J5iO1davr7Gy4hr92Q5r-v-grWWjEV7ZyHe60WXfGiKWjCRA_QG64maxxctzhr9jGNoKdX9o0V0LFuIUl7nHb5E">
            <h2>Wireless Headphones</h2>
            <p>Good quality wireless headphones.</p>
            <h3>₹1,499</h3>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://encrypted-tbn2.gstatic.com/shopping?q=tbn:ANd9GcRtfNT3n4o7OCHCs4HP6slknNIkCMrFr1ZRTrMajKNR_sgtvPLLrabQWGyQPjqhMCst20W5gjSs3KFypSiKoa-361DifbRPTVFZjvJoFrdLc0jOvCG_uaPptQ">
            <h2>Smart Watch</h2>
            <p>Stylish watch with fitness tracking.</p>
            <h3>₹2,499</h3>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://encrypted-tbn3.gstatic.com/shopping?q=tbn:ANd9GcQjOHXk_7ec0UZYYx_SsSzyVzIvaXTrNO0fTt1oRwzDMRXdzDvvRNf1F6u2rcOR84NA2spgU1Mpzrif8elVzn_eR9jKxwzxxcL4eqG_p6loz8j-Ze0_vmysrA">
            <h2>Bluetooth Speaker</h2>
            <p>Portable speaker with good sound.</p>
            <h3>₹999</h3>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcTXDxy-85QYWB-Pa8XL3umEn9KtpTC5iQzl7kX8roo-UWU21dHKH93irWnJydwgY_jAe0FwJ5YkwcxID7ip6Xps64Yg0V61iLFLYucNA9ehdUum8SDR39No">
            <h2>Gaming Mouse</h2>
            <p>Comfortable mouse for gaming.</p>
            <h3>₹799</h3>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
