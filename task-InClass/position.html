<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        .box{
            width: 500px;
            height: 200px;
            color: white;
            font-weight: 900;
            font-size: 30px;
            text-align: center;
            position: sticky;
            top: 30px;

        }
        
        #box1{
            background-color: black;
        }
        #box2{
            background-color: blue;
        }
        #box3{
            background-color: red;
            position: sticky;
            top: 100px;
        }
        #box4{
            background-color: green;
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="box" id="box1"><p style="margin: 0; padding: 0%;">1</p></div>
    <div class="box" id="box2"><p style="margin: 0; padding: 0%;">2</p></div>
    <div class="box" id="box3"><p style="margin: 0; padding: 0%;">3</p></div>
    <div class="box" id="box4"><p style="margin: 0; padding: 0%;">4</p></div>
    </div>
</body>
</html>
