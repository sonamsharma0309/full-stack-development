<!DOCTYPE html>
<html>
<head>
    <title>Navbar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        nav {
            background-color: #333;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
        }

        nav a:hover {
            color: lightblue;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

</body>
</html>
