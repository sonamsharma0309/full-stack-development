<!DOCTYPE html>
<html>
<head>
    <title>Grid Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 500px;
            height: 600px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 5px;
            padding: 5px;
            background: white;
        }

        .box {
            overflow: hidden;
        }

        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .top {
            grid-column: 1 / 3;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box top">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7">
        </div>

        <div class="box">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e">
        </div>

        <div class="box">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e">
        </div>

        <div class="box">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470">
        </div>

        <div class="box">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e">
        </div>

    </div>

</body>
</html>
